# https://taskfile.dev

version: '3'

vars:
  GREETING: "PlemolKR Font Build System"
  VERSION:
    sh: grep "VERSION" build.ini | cut -d "=" -f 2 | tr -d " "

tasks:
  default:
    desc: 빌드 시스템 정보 표시
    silent: true
    cmds:
      - echo "{{.GREETING}}"
      - echo "버전{{"{{"}} .VERSION {{"}}"}}"
      - echo ""
      - task --list-all

  # ============================================
  # 기본 빌드 태스크
  # ============================================

  build:
    desc: 기본 빌드 (1:2 비율)
    cmds:
      - python fontforge_script.py
      - echo "✅ 기본 빌드 완료"

  build:35:
    desc: 3:5 비율 빌드
    cmds:
      - python fontforge_script.py --35 --do-not-delete-build-dir
      - echo "✅ 3:5 비율 빌드 완료"

  build:console:
    desc: 콘솔 모드 빌드 (1:2 비율)
    cmds:
      - python fontforge_script.py --console --do-not-delete-build-dir
      - echo "✅ 콘솔 모드 빌드 완료"

  build:console35:
    desc: 콘솔 모드 빌드 (3:5 비율)
    cmds:
      - python fontforge_script.py --console --35 --do-not-delete-build-dir
      - echo "✅ 콘솔 모드 (3:5) 빌드 완료"

  build:nf:
    desc: Nerd Fonts 포함 빌드 (1:2 비율)
    cmds:
      - python fontforge_script.py --nerd-font --do-not-delete-build-dir
      - echo "✅ Nerd Fonts 빌드 완료"

  build:nf35:
    desc: Nerd Fonts 포함 빌드 (3:5 비율)
    cmds:
      - python fontforge_script.py --nerd-font --35 --do-not-delete-build-dir
      - echo "✅ Nerd Fonts (3:5) 빌드 완료"

  build:console-nf:
    desc: 콘솔 모드 + Nerd Fonts (1:2 비율)
    cmds:
      - python fontforge_script.py --console --nerd-font --do-not-delete-build-dir
      - echo "✅ 콘솔 + Nerd Fonts 빌드 완료"

  build:console-nf35:
    desc: 콘솔 모드 + Nerd Fonts (3:5 비율)
    cmds:
      - python fontforge_script.py --console --nerd-font --35 --do-not-delete-build-dir
      - echo "✅ 콘솔 + Nerd Fonts (3:5) 빌드 완료"

  build:hs:
    desc: 전각 스페이스 숨김 빌드 (1:2 비율)
    cmds:
      - python fontforge_script.py --hidden-zenkaku-space --do-not-delete-build-dir
      - echo "✅ 전각 스페이스 숨김 빌드 완료"

  build:hs35:
    desc: 전각 스페이스 숨김 빌드 (3:5 비율)
    cmds:
      - python fontforge_script.py --hidden-zenkaku-space --35 --do-not-delete-build-dir
      - echo "✅ 전각 스페이스 숨김 (3:5) 빌드 완료"

  # ============================================
  # 폰트 최종 처리 태스크
  # ============================================

  polish:
    desc: 빌드된 폰트 최종 처리 (힌팅 및 병합)
    cmds:
      - python fonttools_script.py
      - echo "✅ 폰트 최종 처리 완료"

  polish:variant:
    desc: 특정 변형 폰트만 처리
    cmds:
      - python fonttools_script.py {{.VARIANT}}
      - echo "✅ {{.VARIANT}} 변형 처리 완료"

  # ============================================
  # Nerd Fonts 패치
  # ============================================

  patch:nerd:
    desc: PlemolKRConsole 폰트에 Nerd Fonts 패치 → PlemolKRConsole
    silent: true
    cmds:
      - mkdir -p build/nerd
      - |
        for font in build/PlemolKRConsole-*.ttf; do
          if [ ! -f "$font" ]; then
            echo "❌ PlemolKRConsole 폰트가 없습니다. 먼저 빌드를 실행하세요."
            exit 1
          fi
          variation=$(basename "$font" .ttf | sed 's/PlemolKRConsole-//')
          echo "🔧 패치 중: $font → PlemolKRConsole-$variation.ttf"
          mkdir -p build/nerd/tmp
          fontforge --script FontPatcher/font-patcher \
            --complete --careful --single-width-glyphs \
            --outputdir build/nerd/tmp \
            "$font" 2>&1 | grep -v "^Copyright" | grep -v "^$" || true
          # 생성된 파일을 원하는 이름으로 변경
          mv build/nerd/tmp/*.ttf "build/nerd/PlemolKRConsole-$variation.ttf" 2>/dev/null || \
            echo "⚠️  $variation 처리 중 오류 발생"
          rm -rf build/nerd/tmp
        done
      - echo ""
      - echo "✅ Nerd Fonts 패치 완료 (PlemolKRConsole)"
      - ls -lh build/nerd/PlemolKRConsole-*.ttf 2>/dev/null || echo "생성된 폰트가 없습니다"

  patch:nerd:wide:
    desc: PlemolKR35Console 폰트에 Nerd Fonts 패치 → PlemolKR35Console
    silent: true
    cmds:
      - mkdir -p build/nerd
      - |
        for font in build/PlemolKR35Console-*.ttf; do
          if [ ! -f "$font" ]; then
            echo "❌ PlemolKR35Console 폰트가 없습니다. 먼저 빌드를 실행하세요."
            exit 1
          fi
          variation=$(basename "$font" .ttf | sed 's/PlemolKR35Console-//')
          echo "🔧 패치 중: $font → PlemolKR35Console-$variation.ttf"
          mkdir -p build/nerd/tmp
          fontforge --script FontPatcher/font-patcher \
            --complete --careful --single-width-glyphs \
            --outputdir build/nerd/tmp \
            "$font" 2>&1 | grep -v "^Copyright" | grep -v "^$" || true
          # 생성된 파일을 원하는 이름으로 변경
          mv build/nerd/tmp/*.ttf "build/nerd/PlemolKR35Console-$variation.ttf" 2>/dev/null || \
            echo "⚠️  $variation 처리 중 오류 발생"
          rm -rf build/nerd/tmp
        done
      - echo ""
      - echo "✅ Nerd Fonts 패치 완료 (PlemolKR35Console)"
      - ls -lh build/nerd/PlemolKR35Console-*.ttf 2>/dev/null || echo "생성된 폰트가 없습니다"

  patch:nerd:all:
    desc: 모든 Console 폰트에 Nerd Fonts 패치 (PlemolKRConsole + PlemolKR35Console)
    cmds:
      - echo "🚀 전체 Nerd Fonts 패치 시작..."
      - task patch:nerd
      - task patch:nerd:wide
      - echo ""
      - echo "✅ 전체 Nerd Fonts 패치 완료!"
      - echo ""
      - echo "📊 생성된 폰트 목록:"
      - ls -lh build/nerd/*.ttf 2>/dev/null || echo "생성된 폰트가 없습니다"

  clean:nerd:
    desc: 패치된 Nerd Fonts 폰트 정리
    cmds:
      - rm -rf build/nerd
      - echo "✅ Nerd Fonts 폰트 정리 완료"

  # ============================================
  # 전체 빌드 워크플로우
  # ============================================

  full:
    desc: 전체 빌드 (1:2 + 3:5 비율)
    cmds:
      - echo "🚀 전체 빌드 시작..."
      - task clean
      - task build
      - task build:35
      - task polish
      - echo "✅ 전체 빌드 완료!"
      - ls -lh build/PlemolKR*.ttf | grep -v fontforge | grep -v fonttools

  full:all:
    desc: 모든 변형 빌드 (기본 + 3:5 + 콘솔)
    cmds:
      - echo "🚀 모든 변형 빌드 시작..."
      - task clean
      - task build
      - task build:35
      - task build:console
      - task build:console35
      - task polish
      - echo "✅ 모든 변형 빌드 완료!"
      - ls -lh build/PlemolKR*.ttf | grep -v fontforge | grep -v fonttools

  full:nerd:
    desc: Nerd Fonts 포함 전체 빌드
    cmds:
      - echo "🚀 Nerd Fonts 전체 빌드 시작..."
      - task clean
      - task build:console-nf
      - task build:console-nf35
      - task polish
      - echo "✅ Nerd Fonts 전체 빌드 완료!"
      - ls -lh build/PlemolKR*.ttf | grep -v fontforge | grep -v fonttools

  # ============================================
  # 빠른 빌드 (디버그)
  # ============================================

  quick:
    desc: 빠른 빌드 (Regular 웨이트만)
    cmds:
      - python fontforge_script.py --debug
      - python fonttools_script.py
      - ls -lh build/PlemolKR-Regular.ttf
      - echo "✅ 빠른 빌드 완료 (Regular만)"

  quick:35:
    desc: 빠른 빌드 (3:5 비율, Regular만)
    cmds:
      - python fontforge_script.py --debug --35
      - python fonttools_script.py 35
      - ls -lh build/PlemolKR35-Regular.ttf
      - echo "✅ 빠른 빌드 완료 (3:5, Regular만)"

  quick:nerd:
    desc: 빠른 Nerd Fonts 빌드 (Console 1:2 + 3:5, Regular/Bold만)
    cmds:
      - echo "🚀 빠른 Nerd Fonts 빌드 시작..."
      - python fontforge_script.py --console --nerd-font --minimal
      - python fontforge_script.py --console --nerd-font --35 --minimal --do-not-delete-build-dir
      - python fonttools_script.py
      - echo ""
      - echo "✅ 빠른 Nerd Fonts 빌드 완료!"
      - echo ""
      - echo "📊 생성된 폰트 목록:"
      - ls -lh build/PlemolKRConsoleNF-*.ttf build/PlemolKRConsoleNF35-*.ttf 2>/dev/null || echo "폰트를 찾을 수 없습니다"

  # ============================================
  # 유틸리티 태스크
  # ============================================

  clean:
    desc: 빌드 디렉토리 정리
    cmds:
      - rm -rf build
      - mkdir -p build
      - echo "✅ 빌드 디렉토리 정리 완료"

  check:
    desc: 생성된 폰트 파일 확인
    cmds:
      - echo "📊 생성된 폰트 파일 목록:"
      - ls -lh build/PlemolKR*.ttf | grep -v fontforge | grep -v fonttools || echo "폰트 파일이 없습니다."
      - echo ""
      - echo "📈 글리프 수 확인:"
      - python work_scripts/check_glyph_number.py build/PlemolKR-Regular.ttf 2>/dev/null || echo "Regular 폰트를 찾을 수 없습니다."

  verify:
    desc: 한글/일본어/이모지 문자 확인
    cmds:
      - |
        python3 -c "
        import fontforge
        font = fontforge.open('build/PlemolKR-Regular.ttf')
        korean = [(0xAC00, '가'), (0xD7A3, '힣')]
        japanese = [(0x3042, 'あ'), (0x30A2, 'ア')]
        emoji = [
            (0x2713, '✓', 'Check mark'),
            (0x2714, '✔', 'Heavy check mark'),
            (0x2717, '✗', 'Ballot X'),
            (0x2718, '✘', 'Heavy ballot X'),
            (0x274C, '❌', 'Cross mark')
        ]
        print('한글:', all(c in font for c, _ in korean))
        print('일본어:', all(c in font for c, _ in japanese))
        print('이모지:')
        for code, char, name in emoji:
            present = code in font
            status = '✓' if present else '✗'
            print(f'  {status} U+{code:04X} {char} ({name})')
        font.close()
        "

  verify:nerd:
    desc: Nerd Fonts 아이콘 확인
    cmds:
      - |
        python3 -c "
        import fontforge
        import sys
        import os

        # Nerd Fonts 파일 찾기 (두 가지 경로 확인)
        nf_fonts = []

        # 1. build 디렉토리 - fontforge_script.py --nerd-font로 빌드된 파일
        if os.path.exists('build'):
            for f in os.listdir('build'):
                if 'NF' in f and f.endswith('.ttf') and not f.startswith('fontforge') and not f.startswith('fonttools'):
                    nf_fonts.append(os.path.join('build', f))

        # 2. build/nerd 디렉토리 - FontPatcher로 패치된 파일
        if os.path.exists('build/nerd'):
            for f in os.listdir('build/nerd'):
                if f.endswith('.ttf'):
                    nf_fonts.append(os.path.join('build/nerd', f))

        if not nf_fonts:
            print('❌ Nerd Fonts 폰트를 찾을 수 없습니다.')
            print('   먼저 빌드를 실행하세요:')
            print('   - task build:nf 또는 task quick:nerd (내장 빌드)')
            print('   - task patch:nerd:all (FontPatcher 패치)')
            sys.exit(0)

        # 첫 번째 Nerd Fonts 파일 확인
        font_path = sorted(nf_fonts)[0]
        print(f'확인 중: {os.path.basename(font_path)}')
        print()

        font = fontforge.open(font_path)

        # Nerd Fonts 주요 범위 확인
        nerd_ranges = [
            ('Powerline', [
                (0xE0A0, 'Branch'),
                (0xE0A1, 'Line number'),
                (0xE0A2, 'Readonly'),
                (0xE0B0, 'Left hard divider'),
                (0xE0B2, 'Right hard divider'),
            ]),
            ('Devicons', [
                (0xE700, 'Aarch64'),
                (0xE779, 'GNU'),
                (0xE7A2, 'CouchDB'),
            ]),
            ('Font Awesome', [
                (0xF015, 'House'),
                (0xF07B, 'Folder'),
                (0xF09B, 'GitHub'),
                (0xF113, 'GitHub Alt'),
                (0xF121, 'Code'),
            ]),
            ('Octicons', [
                (0xF400, 'Light bulb'),
                (0xF417, 'Git commit'),
            ]),
            ('Pomicons', [
                (0xE000, 'Clean code'),
            ]),
        ]

        for category, icons in nerd_ranges:
            print(f'{category}:')
            for code, name in icons:
                present = code in font
                status = '✓' if present else '✗'
                char = chr(code)
                print(f'  {status} U+{code:04X} {char} ({name})')
            print()

        # 전체 통계
        powerline_range = sum(1 for i in range(0xE0A0, 0xE0D8) if i in font)
        devicons_range = sum(1 for i in range(0xE700, 0xE7C6) if i in font)
        fontawesome_range = sum(1 for i in range(0xF000, 0xF2E1) if i in font)

        print('범위별 통계:')
        print(f'  Powerline (E0A0-E0D7): {powerline_range}/56 글리프')
        print(f'  Devicons (E700-E7C5): {devicons_range}/198 글리프')
        print(f'  Font Awesome (F000-F2E0): {fontawesome_range}/737 글리프')

        font.close()
        "

  install:
    desc: 폰트를 시스템에 설치 (macOS)
    cmds:
      - cp build/PlemolKR-*.ttf ~/Library/Fonts/
      - echo "✅ 폰트 설치 완료 (~/Library/Fonts/)"

  # ============================================
  # 릴리스 준비
  # ============================================

  release:
    desc: 릴리스 파일 준비
    vars:
      TIMESTAMP:
        sh: date +%Y%m%d%H%M%S
    cmds:
      - mkdir -p release_files/build_{{.TIMESTAMP}}
      - cp build/PlemolKR*.ttf release_files/build_{{.TIMESTAMP}}/ 2>/dev/null || true
      - echo "✅ 릴리스 파일 준비 완료 release_files/build_{{.TIMESTAMP}}/"
      - ls -lh release_files/build_{{.TIMESTAMP}}/

  # ============================================
  # 정보 표시
  # ============================================

  info:
    desc: 빌드 환경 정보 표시
    cmds:
      - echo "📦 PlemolKR 빌드 시스템"
      - echo "버전{{"{{"}} .VERSION {{"}}"}}"
      - echo ""
      - echo "🐍 Python 버전:"
      - python --version
      - echo ""
      - echo "🔧 FontForge 버전:"
      - fontforge --version 2>&1 | head -1 || echo "FontForge를 찾을 수 없습니다"
      - echo ""
      - echo "📚 설치된 패키지:"
      - pip3 list | grep -E "fonttools|ttfautohint" || echo "필요한 패키지를 설치하세요"
